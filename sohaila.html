<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>سهيلة ✦ For Sohaila</title>
<meta name="description" content="همسات بين النجوم — لكِ يا سهيلة." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l2.6 9.2L28 14l-9.4 2.8L16 26l-2.6-9.2L4 14l9.4-2.8z' fill='%23e9c976'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-1:#05050f;
    --bg-2:#0b0b22;
    --bg-3:#12122e;
    --gold:#e9c976;
    --gold-soft:#f6e2a3;
    --gold-deep:#c9a85a;
    --cream:#f4efe2;
    --muted:rgba(244,239,226,.58);
    --line:rgba(233,201,118,.22);
    --panel:rgba(246,226,163,.04);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    min-height:100svh;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(54,46,110,.55), transparent 60%),
      radial-gradient(900px 600px at 85% 110%, rgba(120,90,40,.18), transparent 55%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 55%, #030308 100%);
    color:var(--cream);
    font-family:"Outfit",sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* starfield canvas sits behind everything */
  #sky{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    display:block;
  }

  /* soft vignette over the canvas for depth */
  .vignette{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(circle at 50% 42%, transparent 38%, rgba(3,3,12,.72) 100%);
  }

  .stage{
    position:relative;
    z-index:2;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(18px,3.2vh,34px);
    text-align:center;
    padding:clamp(28px,6vw,64px) clamp(20px,5vw,40px);
    opacity:0;
    transform:translateY(14px) scale(.985);
    animation:enter 1.5s cubic-bezier(.16,.84,.3,1) .15s forwards;
  }
  @keyframes enter{to{opacity:1;transform:none}}

  /* monogram S */
  .monogram{
    width:clamp(58px,12vw,76px);
    height:clamp(58px,12vw,76px);
    display:grid;
    place-items:center;
    border-radius:50%;
    border:1px solid var(--line);
    background:radial-gradient(circle at 50% 35%, rgba(246,226,163,.10), transparent 70%);
    box-shadow:0 0 28px rgba(233,201,118,.10), inset 0 0 18px rgba(233,201,118,.06);
  }
  .monogram span{
    font-family:"Cormorant Garamond",serif;
    font-weight:500;
    font-size:clamp(30px,7vw,40px);
    background:linear-gradient(180deg,var(--gold-soft),var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1;
    transform:translateY(2px);
  }

  .name{
    font-family:"Aref Ruqaa",serif;
    font-weight:700;
    font-size:clamp(64px,17vw,128px);
    line-height:.96;
    background:linear-gradient(178deg,var(--gold-soft) 8%,var(--gold) 55%,var(--gold-deep) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 50px rgba(233,201,118,.18);
    letter-spacing:0;
    animation:drift 7s ease-in-out infinite;
  }
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  .name-latin{
    direction:ltr;
    font-family:"Cormorant Garamond",serif;
    font-style:italic;
    font-size:clamp(15px,3vw,20px);
    letter-spacing:.42em;
    color:var(--muted);
    text-transform:uppercase;
    margin-top:-2px;
    padding-inline-start:.42em;
  }

  .intro{
    font-family:"Amiri",serif;
    font-size:clamp(16px,3.4vw,21px);
    color:var(--muted);
    max-width:30ch;
    line-height:1.7;
  }

  /* the whisper panel */
  .reveal{
    width:min(92vw,640px);
    min-height:clamp(168px,26vh,210px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(26px,5vw,40px) clamp(22px,5vw,44px);
    border:1px solid var(--line);
    border-radius:22px;
    background:var(--panel);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(246,226,163,.06);
    position:relative;
    overflow:hidden;
  }
  /* faint corner stars on the panel */
  .reveal::before,
  .reveal::after{
    content:"✦";
    position:absolute;
    color:var(--gold);
    opacity:.28;
    font-size:13px;
  }
  .reveal::before{top:14px;inset-inline-start:18px}
  .reveal::after{bottom:14px;inset-inline-end:18px}

  .verse-wrap{
    transition:opacity .42s ease, transform .42s cubic-bezier(.16,.84,.3,1);
  }
  .verse-wrap.out{opacity:0;transform:translateY(10px)}

  .verse{
    font-family:"Amiri",serif;
    font-weight:400;
    font-size:clamp(22px,5vw,32px);
    line-height:1.85;
    color:var(--cream);
    text-shadow:0 0 30px rgba(233,201,118,.10);
  }
  .verse-en{
    direction:ltr;
    font-family:"Cormorant Garamond",serif;
    font-style:italic;
    font-size:clamp(13.5px,2.7vw,16.5px);
    color:var(--muted);
    margin-top:14px;
    line-height:1.55;
    letter-spacing:.01em;
  }
  .prompt .verse{color:var(--gold-soft);font-size:clamp(19px,4.4vw,26px)}

  /* the star button */
  .star-btn{
    --size:clamp(96px,21vw,128px);
    width:var(--size);
    height:var(--size);
    border:none;
    background:transparent;
    cursor:pointer;
    display:grid;
    place-items:center;
    position:relative;
    border-radius:50%;
    outline:none;
    -webkit-tap-highlight-color:transparent;
  }
  .star-btn .halo{
    position:absolute;
    inset:-18%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(233,201,118,.30), transparent 65%);
    animation:breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
  .star-btn .disk{
    position:absolute;
    inset:24%;
    border-radius:50%;
    background:radial-gradient(circle at 50% 38%, var(--gold-soft), var(--gold) 55%, var(--gold-deep));
    box-shadow:0 0 26px rgba(233,201,118,.55), 0 0 60px rgba(233,201,118,.28);
  }
  .star-btn svg{position:relative;width:46%;height:46%;filter:drop-shadow(0 1px 2px rgba(80,55,10,.45))}
  .star-btn:hover .disk{box-shadow:0 0 34px rgba(246,226,163,.7), 0 0 78px rgba(233,201,118,.36)}
  .star-btn:active{transform:scale(.94)}
  .star-btn:focus-visible{box-shadow:0 0 0 3px rgba(246,226,163,.55)}

  .hint{
    font-size:clamp(11.5px,2.5vw,13px);
    color:var(--muted);
    letter-spacing:.04em;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:-6px;
  }
  .hint .dot{width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.6}
  kbd{
    font-family:"Outfit",sans-serif;
    font-size:11px;
    border:1px solid var(--line);
    border-bottom-width:2px;
    border-radius:6px;
    padding:2px 9px;
    color:var(--gold-soft);
    background:rgba(246,226,163,.05);
  }

  .sign{
    margin-top:clamp(8px,2vh,20px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .sign .made{
    font-family:"Amiri",serif;
    font-size:13px;
    color:var(--muted);
  }
  .sign .from{
    direction:ltr;
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(16px,3.4vw,19px);
    letter-spacing:.16em;
    color:var(--gold-soft);
  }
  .sign .from .heart{color:var(--gold);font-size:.85em}
  .sign .from-ar{font-family:"Aref Ruqaa",serif;color:var(--muted);font-size:14px}

  @media (max-width:380px){
    .name-latin{letter-spacing:.3em}
    .reveal{border-radius:18px}
  }

  @media (prefers-reduced-motion: reduce){
    .stage{animation:none;opacity:1;transform:none}
    .name{animation:none}
    .star-btn .halo{animation:none}
    .verse-wrap{transition:opacity .25s ease}
    .verse-wrap.out{transform:none}
  }
</style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <div class="monogram" aria-hidden="true"><span>S</span></div>

    <h1 class="name">سهيلة</h1>
    <div class="name-latin">Sohaila</div>

    <p class="intro">لكِ وحدكِ… همساتٌ خبّأتُها بين النجوم</p>

    <section class="reveal prompt" id="reveal" aria-live="polite">
      <div class="verse-wrap" id="verseWrap">
        <div class="verse" id="verseAr">✦ المسي النجمة لتبدأ الحكاية ✦</div>
        <div class="verse-en" id="verseEn">Touch the star to begin</div>
      </div>
    </section>

    <button class="star-btn" id="starBtn" aria-label="اكشفي همسة جديدة" role="button" tabindex="0">
      <span class="halo" aria-hidden="true"></span>
      <span class="disk" aria-hidden="true"></span>
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5l3 9.7 9.9 .2-7.9 6 2.9 9.6L16 30.4 8.1 36.0" fill="none"/><path d="M16 2l2.9 9.4H28l-7.6 5.6 2.9 9.4L16 20.8 8.7 26.4l2.9-9.4L4 11.4h9.1z" fill="#5a3f10"/></svg>
    </button>

    <div class="hint">
      <span>المسي النجمة</span>
      <span class="dot" aria-hidden="true"></span>
      <span>أو اضغطي <kbd>مفتاح المسافة</kbd></span>
    </div>

    <footer class="sign">
      <span class="made">صُنِع بكلِّ الحُبّ</span>
      <span class="from"><span class="heart">♥</span> From Muayad</span>
      <span class="from-ar">— مؤيّد —</span>
    </footer>
  </main>

<script>
(function(){
  "use strict";

  /* ---------- the whispers (Arabic verse + soft English translation) ---------- */
  var VERSES = [
    {ar:"سُهيلةُ… اسمٌ يبدأُ بالسِّينِ، وبهِ تبدأُ كلُّ سعادتي",
     en:"Sohaila… a name that begins with S, and with it begins all my happiness."},
    {ar:"في السماءِ نجمٌ اسمُهُ سُهيل، وفي قلبي نجمةٌ اسمُها سُهيلة",
     en:"In the sky, a star named Suhayl; in my heart, a star named Sohaila."},
    {ar:"أنتِ السُّكونُ حينَ يضِجُّ العالَم، والسلامُ حينَ يضيقُ كلُّ شيء",
     en:"You are the stillness when the world grows loud, and the peace when everything closes in."},
    {ar:"لو عُدَّتِ النجومُ لكنتِ أسطعَها… وأقربَها إلى القلب",
     en:"If the stars were counted, you would be the brightest… and the nearest to the heart."},
    {ar:"كتبتُ حرفَ السِّينِ في السماء، فصارَ نجمةً تُضيءُ باسمِكِ",
     en:"I wrote the letter S in the sky, and it became a star that shines with your name."},
    {ar:"يكفي أن أُناديكِ «سُهيلة»، حتى يبتسمَ المساءُ كلُّه",
     en:"It is enough that I call you Sohaila, for the whole evening to smile."},
    {ar:"ابتسامتُكِ سِرٌّ من أسرارِ الضوء… لذلكَ تُضيئينَ كلَّ من حولكِ",
     en:"Your smile is one of the secrets of light… that is why you brighten all around you."},
    {ar:"كلُّ الطرقِ تتشابهُ، إلا الطريقَ الذي يقودُ إليكِ",
     en:"All roads resemble one another, except the one that leads to you."},
    {ar:"ومهما اتّسعتِ السماء، تبقينَ أنتِ أجملَ ما فيها… يا سُهيلتي",
     en:"And however wide the sky grows, you remain the most beautiful thing in it… my Sohaila."}
  ];

  /* ---------- shuffled queue, never repeats immediately ---------- */
  var queue = [], lastIndex = -1;
  function refill(){
    queue = VERSES.map(function(_,i){return i;});
    for(var i=queue.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=queue[i];queue[i]=queue[j];queue[j]=t;
    }
    if(queue[0]===lastIndex && queue.length>1){
      queue.push(queue.shift());
    }
  }
  function nextVerse(){
    if(queue.length===0) refill();
    var idx=queue.shift();
    lastIndex=idx;
    return VERSES[idx];
  }

  /* ---------- reveal interaction ---------- */
  var reveal=document.getElementById("reveal");
  var wrap=document.getElementById("verseWrap");
  var arEl=document.getElementById("verseAr");
  var enEl=document.getElementById("verseEn");
  var btn=document.getElementById("starBtn");
  var locked=false;

  function show(){
    if(locked) return;
    locked=true;
    burst();
    wrap.classList.add("out");
    setTimeout(function(){
      var v=nextVerse();
      reveal.classList.remove("prompt");
      arEl.textContent=v.ar;
      enEl.textContent=v.en;
      wrap.classList.remove("out");
      setTimeout(function(){locked=false;},260);
    },300);
  }

  btn.addEventListener("click",show);
  window.addEventListener("keydown",function(e){
    if(e.code==="Space"||e.key===" "||e.code==="Enter"||e.key==="Enter"){
      e.preventDefault();
      show();
    }
  });

  /* ---------- canvas: starfield, S-constellation, shooting stars, sparkle bursts ---------- */
  var canvas=document.getElementById("sky");
  var ctx=canvas.getContext("2d");
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W=0,H=0,DPR=1;
  var stars=[], particles=[], shooters=[];
  var nextShootAt=0;

  // normalized control points that trace an "S"
  var S_PTS=[
    [0.74,0.10],[0.46,0.035],[0.20,0.15],[0.27,0.39],
    [0.55,0.50],[0.79,0.62],[0.71,0.86],[0.42,0.965],[0.16,0.875]
  ];

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=Math.floor(W*DPR);
    canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildStars();
  }

  function buildStars(){
    var count=Math.min(240,Math.floor(W*H/8200));
    stars=[];
    for(var i=0;i<count;i++){
      stars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:Math.random()*1.3+0.3,
        a:Math.random()*0.5+0.25,
        tw:Math.random()*0.018+0.004,
        ph:Math.random()*Math.PI*2,
        gold:Math.random()<0.18
      });
    }
  }

  function constellationPoints(){
    var box=Math.min(W,H)*0.5;
    var ox=W/2-box/2;
    var oy=H*0.43-box/2;
    return S_PTS.map(function(p){return [ox+p[0]*box, oy+p[1]*box];});
  }

  function burst(){
    if(reduce) return;
    var rect=btn.getBoundingClientRect();
    var cx=rect.left+rect.width/2;
    var cy=rect.top+rect.height/2;
    var n=26;
    for(var i=0;i<n;i++){
      var ang=Math.random()*Math.PI*2;
      var spd=Math.random()*3.4+1.2;
      particles.push({
        x:cx,y:cy,
        vx:Math.cos(ang)*spd,
        vy:Math.sin(ang)*spd-0.6,
        life:1,
        decay:Math.random()*0.02+0.014,
        size:Math.random()*2+1,
        gold:Math.random()<0.6
      });
    }
  }

  function spawnShooter(t){
    var fromLeft=Math.random()<0.5;
    var y=Math.random()*H*0.5;
    shooters.push({
      x:fromLeft?-40:W+40,
      y:y,
      vx:(fromLeft?1:-1)*(Math.random()*4+6),
      vy:Math.random()*2+1.4,
      life:1,
      len:Math.random()*120+90
    });
    nextShootAt=t+(Math.random()*5000+4500);
  }

  function frame(t){
    ctx.clearRect(0,0,W,H);

    // background stars
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.ph+=s.tw;
      var tw=reduce?s.a:(s.a+Math.sin(s.ph)*0.28);
      if(tw<0.05)tw=0.05;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=s.gold
        ? "rgba(233,201,118,"+tw+")"
        : "rgba(244,239,226,"+tw+")";
      ctx.fill();
    }

    // S constellation (subtle)
    var pts=constellationPoints();
    ctx.lineWidth=1;
    ctx.strokeStyle="rgba(233,201,118,0.07)";
    ctx.beginPath();
    for(var k=0;k<pts.length;k++){
      if(k===0)ctx.moveTo(pts[k][0],pts[k][1]);
      else ctx.lineTo(pts[k][0],pts[k][1]);
    }
    ctx.stroke();
    for(var k2=0;k2<pts.length;k2++){
      var p=pts[k2];
      var pulse=reduce?0.5:(0.42+Math.sin(t*0.0014+k2)*0.18);
      ctx.beginPath();
      ctx.arc(p[0],p[1],1.7,0,Math.PI*2);
      ctx.fillStyle="rgba(246,226,163,"+pulse+")";
      ctx.shadowColor="rgba(233,201,118,0.6)";
      ctx.shadowBlur=8;
      ctx.fill();
      ctx.shadowBlur=0;
    }

    // shooting stars
    if(!reduce){
      if(t>nextShootAt) spawnShooter(t);
      for(var sh=shooters.length-1;sh>=0;sh--){
        var o=shooters[sh];
        o.x+=o.vx;o.y+=o.vy;o.life-=0.012;
        var tx=o.x-o.vx/Math.hypot(o.vx,o.vy)*o.len;
        var ty=o.y-o.vy/Math.hypot(o.vx,o.vy)*o.len;
        var grad=ctx.createLinearGradient(o.x,o.y,tx,ty);
        grad.addColorStop(0,"rgba(246,226,163,"+(0.85*o.life)+")");
        grad.addColorStop(1,"rgba(246,226,163,0)");
        ctx.strokeStyle=grad;
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(o.x,o.y);
        ctx.lineTo(tx,ty);
        ctx.stroke();
        if(o.life<=0||o.x< -60||o.x>W+60||o.y>H+60)shooters.splice(sh,1);
      }
    }

    // sparkle particles
    for(var pIdx=particles.length-1;pIdx>=0;pIdx--){
      var pa=particles[pIdx];
      pa.x+=pa.vx;pa.y+=pa.vy;pa.vy+=0.045;pa.vx*=0.99;pa.life-=pa.decay;
      if(pa.life<=0){particles.splice(pIdx,1);continue;}
      ctx.globalAlpha=Math.max(pa.life,0);
      ctx.beginPath();
      ctx.arc(pa.x,pa.y,pa.size,0,Math.PI*2);
      ctx.fillStyle=pa.gold?"rgba(246,226,163,1)":"rgba(244,239,226,1)";
      ctx.shadowColor="rgba(233,201,118,0.8)";
      ctx.shadowBlur=10;
      ctx.fill();
      ctx.shadowBlur=0;
      ctx.globalAlpha=1;
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener("resize",resize);
  resize();
  nextShootAt=performance.now()+2200;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
