<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - مدرسة ابن خلدون</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4a1a7c;
    --secondary: #7b2fd4;
    --accent: #d4a017;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a2a3a;
    --muted: #6b7f94;
    --border: #d0dce8;
    --danger: #c0392b;
    --success: #2d7a4f;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  .header {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white; padding: 20px; text-align: center;
    box-shadow: 0 4px 20px rgba(74,26,124,0.3);
  }
  .header img { width:60px; height:60px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); margin-bottom:8px; }
  .header h1 { font-size:20px; font-weight:800; }
  .header p { font-size:12px; opacity:0.8; margin-top:4px; }

  .login-wrap { display:flex; align-items:center; justify-content:center; min-height:80vh; padding:20px; }
  .login-card { background:white; border-radius:16px; padding:32px 28px; width:100%; max-width:380px; box-shadow:0 8px 32px rgba(74,26,124,0.15); border:1px solid var(--border); }
  .login-card h2 { font-size:20px; font-weight:800; color:var(--primary); text-align:center; margin-bottom:6px; }
  .login-card p { font-size:13px; color:var(--muted); text-align:center; margin-bottom:24px; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; }
  .form-group input, .form-group select {
    width:100%; padding:11px 14px; border:2px solid var(--border); border-radius:10px;
    font-family:'Tajawal',sans-serif; font-size:14px; color:var(--text); background:var(--bg);
    transition:border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { outline:none; border-color:var(--secondary); background:white; }
  .btn { width:100%; padding:12px; border:none; border-radius:10px; font-family:'Tajawal',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:white; box-shadow:0 4px 14px rgba(74,26,124,0.3); }
  .btn-primary:hover { transform:translateY(-1px); }
  .btn-danger { background:#fdf0f0; color:var(--danger); border:1px solid #f5c6c6; }
  .btn-success { background:#e8f5ee; color:var(--success); border:1px solid #c6e6d3; }
  .btn-sm { width:auto; padding:7px 14px; font-size:13px; }
  .error-login { background:#fdf0f0; border:1px solid #f5c6c6; border-radius:8px; padding:10px; color:var(--danger); font-size:13px; text-align:center; margin-top:12px; display:none; }

  .dashboard { display:none; padding:20px; max-width:900px; margin:0 auto; }
  .dash-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  .dash-header h2 { font-size:18px; font-weight:800; color:var(--primary); }
  .btn-logout { padding:8px 16px; background:transparent; border:2px solid var(--danger); border-radius:8px; color:var(--danger); font-family:'Tajawal',sans-serif; font-size:13px; font-weight:700; cursor:pointer; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px; }
  .stat-card { background:white; border-radius:12px; padding:16px; text-align:center; box-shadow:0 2px 12px rgba(74,26,124,0.08); border:1px solid var(--border); }
  .stat-num { font-size:28px; font-weight:800; color:var(--secondary); }
  .stat-label { font-size:12px; color:var(--muted); margin-top:4px; }

  .tabs { display:flex; gap:8px; margin-bottom:20px; }
  .tab { padding:10px 18px; border-radius:8px; border:2px solid var(--border); background:white; font-family:'Tajawal',sans-serif; font-size:14px; font-weight:600; cursor:pointer; color:var(--muted); transition:all 0.2s; }
  .tab.active { background:var(--secondary); color:white; border-color:var(--secondary); }

  .card { background:white; border-radius:14px; padding:20px; box-shadow:0 2px 12px rgba(74,26,124,0.08); border:1px solid var(--border); margin-bottom:20px; }
  .card h3 { font-size:15px; font-weight:700; color:var(--primary); margin-bottom:16px; padding-bottom:10px; border-bottom:2px solid var(--bg); }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grades-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0; }

  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead tr { background:linear-gradient(135deg,var(--primary),var(--secondary));
